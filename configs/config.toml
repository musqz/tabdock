# openbox-sidepanel config -> ~/.config/openbox-sidepanel/config.toml
# Reload a running panel with: kill -HUP $(pgrep -f 'sidepanel$')   (or restart it)

# Which screen edge the panel sits on: "left" or "right".
# Tip: pick an outer edge of your monitor layout (the pointer stops there, so hover-to-open is easy).
side = "left"

# Which monitor the panel sits on:
#   "outer"   the monitor at the outer edge of the whole screen for `side` (the leftmost monitor for
#             "left", the rightmost for "right"). Only an outer edge can reserve space when pinned, so
#             tiling and maximising respect the panel, and the pointer stops there. Works in any
#             layout and follows monitors being plugged in or moved.
#   "primary" the primary monitor, even if its edge borders another monitor (then a pinned panel can
#             only overlay, and the pin button says so)
#   "DP-1"    a named output, as shown by `xrandr`
monitor = "outer"

# Width in pixels when expanded (100-1000).
width = 320

# What to show while a non-browser window (terminal, file manager, ...) is active:
#   "last" keeps the panel of the browser you used last, "hide" removes the panel.
follow = "last"

# Which browsers the panel lists when it starts:
#   "auto" the browser you are using (it follows the focus, as `follow` says)
#   "all"  every open browser, one foldable section each
# Row of chips under the header (auto, one per browser, all) switches this while running, once two or
# more browsers are open; a chip picking a single browser keeps that browser listed whatever has focus.
view = "auto"

# Start the panel when a browser with the extension opens and no panel is running (a browser start
# is enough, no autostart needed). A panel you quit with the X button is not restarted until the next
# browser start. false = only start it yourself (app menu, autostart line, keybinding).
start_with_browser = true

# Start pinned: the panel stays open and windows are laid out beside it (an outer screen
# edge only; on an inner edge it stays open as an overlay). false = autohide on hover.
pinned = false

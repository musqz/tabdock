# tabdock config -> ~/.config/tabdock/config.toml
# Read when the panel starts: after a change, quit the panel with the x in its header and start it again
# from the menu.

# Which screen edge the panel sits on: "left" or "right".
# Tip: pick an outer edge of your monitor layout (the pointer stops there, so hover-to-open is easy).
side = "left"

# Which monitor the panel lives on. You choose, and the panel is only on that monitor; `side` and the
# header's arrow button then only pick which edge of it:
#   monitor = "primary"   only on the primary display
#   monitor = "DP-1"      only on that output (use the names `xrandr` shows, e.g. "HDMI-1")
#   monitor = "outer"     what you get if you choose nothing: the monitor at the outer edge of the whole
#                         screen for `side` (the leftmost for "left", the rightmost for "right")
# Only an outer edge of the whole screen can reserve space when the panel is pinned (tiling and maximising
# then respect it, and the pointer stops there). A panel on an edge that borders another monitor is an
# overlay when pinned, and the pin button says so. A named monitor that is not connected falls back to
# "outer", with a warning.
monitor = "outer"

# Width in pixels when expanded (100-1000).
width = 320

# What to show while a non-browser window (terminal, file manager, ...) is active:
#   "last" keeps the panel of the browser you used last, "hide" removes the panel.
follow = "last"

# Which browsers the panel lists when it starts:
#   "auto" the browser you are using (it follows the focus, as `follow` says)
#   "all"  every open browser, one foldable section each
# Row of chips under the header (auto, one per browser, all) switches this while running, once two or
# more browsers are open; a chip picking a single browser keeps that browser listed whatever has focus.
view = "auto"

# Show each tab's site icon before its title. Off by default because the panel downloads the icons
# itself (https only, no cookies or referrer, never from local or private addresses, kept in memory,
# nothing written to disk) from YOUR address and system DNS, not through your browser's proxy, VPN
# settings or DNS-over-HTTPS, and for every tab it lists, private windows included if you allowed the
# extension there. See "Site icons" in the README before turning this on.
# The "icons" button in the header switches it while the panel runs (until the next start).
icons = false

# A tab whose title starts with an unread count, e.g. "(3) Inbox", gets a small badge instead of
# showing the count as plain text. On by default: it only reads the title the browser already
# reports, no extra network or permissions. Turn off if a site's title happens to start the same
# way for another reason (a year, a numbered list) and gets mistaken for one.
badges = true

# Start the panel when a browser with the extension opens and no panel is running (a browser start
# is enough, no autostart needed). A panel you quit with the X button is not restarted until the next
# browser start. false = only start it yourself (app menu, autostart line, keybinding).
start_with_browser = true

# Start pinned: the panel stays open and windows are laid out beside it (an outer screen
# edge only; on an inner edge it stays open as an overlay). false = autohide on hover.
pinned = false

# Colours. Every line below [theme] belongs to it, so any other option goes above that line.
# The accent colour is on the strip at the screen edge, the header's top line and browser name, the pin,
# icons and find buttons while they are on, the active tab's bar, the chip picked and the drop marker. By
# default each browser has its own, so you can tell which one the panel shows: Firefox orange, Zen purple,
# FireDragon red, LibreWolf blue, Waterfox teal, Floorp gold, and grey for any other one. Take the # off a
# line to change it; colours are written "#rrggbb" (or "#rgb"). On a dark accent the text turns white,
# and the browser's name takes the usual text colour, so both stay readable.
[theme]
# accent = "#4c9aff"    every browser in this one colour
# firefox = "#4c9aff"   one browser (also zen, firedragon, librewolf, waterfox, floorp): wins over accent
# other = "#8f9bb3"     any other browser, and the strip while no browser is connected

# openbox-sidepanel: picom window rule (picom 12+; written against picom 13).
#
# One rule body, in the style of the per-app files in ~/.config/picom/include/. Copy it there as
# sidepanel.conf and reference it from your rules list, like the other per-app files:
#
#     {
#     @include "sidepanel.conf"
#     },
#
# Put it after your generic `window_type = 'dock'` rule (later rules win): the panel's windows are
# dock windows, so that rule would otherwise give the 3 px strip a corner radius.
#
# The panel never resizes a visible window. It maps and unmaps its full-width window, so the
# compositor's open/close animations apply directly and the panel needs no animation code.
# Both windows have WM_CLASS "Sidepanel": the always-mapped strip is named
# "openbox-sidepanel-strip", the panel "openbox-sidepanel-panel" (match on `name` to single one out).

match = "class_g = 'Sidepanel'";
shadow = false;
corner-radius = 0;
blur-background = false;

# `direction` must match the panel's side in config.toml: "left" for side = "left", "right" for
# side = "right" (picom cannot see the panel's runtime side switch). If the panel slides in from the
# wrong side, flip it. Durations are in seconds.
animations = (
  {
    triggers = ["open", "show"];
    preset = "slide-in";
    direction = "left";
    duration = 0.2;
  },
  {
    triggers = ["close", "hide"];
    preset = "slide-out";
    direction = "left";
    duration = 0.15;
  }
)
